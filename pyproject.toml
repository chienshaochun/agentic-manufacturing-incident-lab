[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-manufacturing-incident-lab"
version = "0.1.0"
description = "A deterministic learning lab for safe manufacturing incident agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]
ui = [
  "streamlit>=1.62,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
